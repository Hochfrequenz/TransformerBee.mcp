[project]
name = "transformerbeemcp"
description = "MCP server for transformer.bee"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+pip@hochfrequenz.de" }]
keywords = ["edifact", "bo4e", "mcp", "transformerbee"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=3.0.0",
    "transformerbeeclient>=0.2.3"
]     # add all the dependencies here
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/python_template_repository/releases"
Homepage = "https://github.com/Hochfrequenz/python_template_repository"

[dependency-groups]
tests = [
    "pytest==9.1.1"
]
linting = [
    "ruff==0.16.5"
]
type_check = [
    "mypy[pydantic]==2.3.1",
    {include-group = "tests"}
]
spell_check = [
    "codespell==2.4.3"
]
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"}
]
dev = [
    "pre-commit",
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "spell_check"},
    {include-group = "coverage"}
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "TC",  # flake8-type-checking
    "S",   # flake8-bandit
    "PIE", # flake8-pie
    "RSE", # flake8-raise
    "ISC", # flake8-implicit-str-concat
]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.isort]
known-first-party = ["transformerbeemcp"]

[tool.ruff.lint.per-file-ignores]
# Standing glob: tests may use assert freely (PLR2004/magic-value-comparison is
# already ignored globally above).
"unittests/**" = [
    "S101", # assert
]
# Generated grandfathering for pre-existing violations (zero lint churn on the
# black/isort/pylint -> ruff switch). New/changed code is held to the full select
# above; burn these down in a follow-up issue.
"src/transformerbeemcp/server.py" = [
    "ARG001", # unused-function-argument
    "RET504", # unnecessary-assign
    "S105",   # hardcoded-password-string
]
"unittests/conftest.py" = [
    "ARG001", # unused-function-argument
    "ARG002", # unused-method-argument
    "RET504", # unnecessary-assign
    "UP035",  # deprecated-import
]

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_your_package_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[project.scripts]
run-transformerbee-mcp-server = "transformerbeemcp.server:main"
# package transformerbeempc
# module server
# function main
