name: "Packaging Test"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  check_packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Build the package
        run: |
          uv build
      - name: Check the built distributions
        run: |
          uv publish --dry-run dist/*
