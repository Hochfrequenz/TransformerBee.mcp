name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  # The matrix "tool" values ("black", "isort") and the required-check names they produce
  # are kept unchanged on purpose, even though both now run ruff under the hood - renaming them
  # would leave the required status checks configured on the branch protection ruleset permanently
  # pending. The "black" leg runs `ruff format --check`; the "isort" leg runs `ruff check --select I`.
  black:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: ["black", "isort"]
        include:
          - tool: "black"
            command: "ruff format --check ."
          - tool: "isort"
            command: "ruff check --select I ."
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          uv run --locked --group linting ${{ matrix.command }}
